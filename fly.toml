# One machine, one volume. That is the whole production footprint until there
# are enough tenants to need more — no database server, no queue, no cache.
app = "exec-assist"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[[mounts]]
  source = "exec_assist_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # SQLite is a single file on a single volume: never run two machines against
  # it. Keep this at one until the storage story changes.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response.headers]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
