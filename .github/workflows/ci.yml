# Runs what `make check` runs, so a commit that does not build cannot sit on a
# branch looking fine.
name: Check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gofmt, go vet and the full test suite. The suite is offline by design —
      # the brief eval is behind a build tag, so nothing here spends money or
      # needs a key.
      - run: make check

      # go.mod and go.sum must cover every platform, not just the one this
      # runs on. A Google library imports a Windows-only package that no Linux
      # build touches, so its checksum was never recorded — every check here
      # passed while the Windows download could not build at all. tidy
      # resolves imports for all platforms, so this fails on the commit that
      # causes it instead.
      - name: Modules are tidy for every platform
        run: go mod tidy -diff

      # The other workflows only run when someone presses a button, so a
      # broken one is otherwise found by the person pressing it. That happened:
      # an empty expression in a comment made GitHub reject the whole file, and
      # a retired runner label meant the Intel Mac build could never start.
      # This catches both kinds on every push. Pinned so it cannot change
      # underneath us.
      - name: Lint the workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=
