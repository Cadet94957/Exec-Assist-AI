# Builds the binaries a non-engineer downloads and runs.
#
# Every job builds on its own operating system rather than cross-compiling.
# That is not a stylistic choice: sqlite-vec and go-sqlite3 are both cgo, so a
# cross-build needs a full C toolchain for the target, and that is the part of
# workflows like this that rots silently. Native runners cost nothing extra and
# the compiler is already there.
name: Build downloads

on:
  # The button. Actions -> Build downloads -> Run workflow, then the binaries
  # appear at the bottom of the run page. This is the one to use day to day.
  workflow_dispatch:
  # A real release, for when you want a permanent link to send someone.
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing should not hide whether the others work.
      fail-fast: false
      matrix:
        include:
          # Named for the person downloading them, not for a build target.
          # "Which one is darwin-arm64" is not a question to make someone
          # answer about their own laptop.
          - runner: macos-latest
            label: ExecAssist-Mac-AppleSilicon
            platform: mac
            note: "Macs with Apple silicon (M1, M2, M3, M4)"
          - runner: macos-13
            label: ExecAssist-Mac-Intel
            platform: mac
            note: "Older Macs with Intel processors"
          - runner: windows-latest
            label: ExecAssist-Windows
            platform: windows
            ext: .exe
            note: "Windows"
          - runner: ubuntu-latest
            label: ExecAssist-Linux
            platform: linux
            note: "Linux"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Tracks the go directive in go.mod so this never drifts from what
          # the code actually requires.
          go-version-file: go.mod
          cache: true

      # Printed on every run so that when a build does break, the log already
      # answers "was there a C compiler?" instead of needing a second run.
      - name: Show the C toolchain
        run: gcc --version
        shell: bash

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -ldflags="-s -w" -o "${{ matrix.label }}${{ matrix.ext }}" ./cmd/server
        shell: bash

      # Proves the binary works on this platform, not just that it compiled.
      #
      # Creating an account in a real timezone is the check that matters: a
      # contractor's Windows laptop has no IANA timezone database, so unless
      # one is embedded in the binary every zone but UTC is rejected. This
      # runner has Go installed and would quietly lend the binary its copy, so
      # both places Go looks — ZONEINFO and GOROOT — are pointed at nothing,
      # leaving the embedded database as the only way this can pass.
      - name: Smoke test
        shell: bash
        run: |
          ./${{ matrix.label }}${{ matrix.ext }} -h
          env -u GOROOT ZONEINFO=/nonexistent \
            ./${{ matrix.label }}${{ matrix.ext }} create-tenant \
              -id smoke-test -name "Smoke Test" -tz America/Los_Angeles \
              -data "$RUNNER_TEMP/smoke"

      # The instructions travel with the download. A README on a web page is
      # not where someone looks when they have just unzipped a file and it
      # will not open.
      - name: Write the instructions
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
          windows)
            cat > "READ ME FIRST.txt" <<'EOF'
          Exec Assist - for Windows

          1. Double-click ExecAssist-Windows.exe

          2. Windows will probably say "Windows protected your PC". That is
             because this app is not signed, not because anything is wrong
             with it. Click "More info", then "Run anyway".

          3. A black window opens and your browser follows a moment later,
             already signed in. You are looking at a demo glazier's day.

          Leave the black window open - that is the app running. Close it, or
          press Ctrl+C in it, to stop.

          Your account name and key are printed in that window. Keep them:
          they are how you sign in from your phone or another computer, and
          the key cannot be shown again.
          EOF
            ;;
          mac)
            # Quoted heredoc: the line below contains $(...) and "$f", which
            # must reach the reader intact rather than run on this build
            # machine. ${{ }} is filled in by GitHub before the shell sees any
            # of it, so the note still comes through.
            cat > "READ ME FIRST.txt" <<'EOF'
          Exec Assist - for ${{ matrix.note }}

          macOS blocks programs downloaded from the internet until you say
          otherwise, so this takes one command rather than a double-click.

          1. Unzip the download in your Downloads folder, if your Mac has not
             already done it for you.

          2. Open Terminal (press Cmd+Space, type Terminal, press Enter).

          3. Copy this whole line, paste it in, and press Enter:

          f=$(ls -t ~/Downloads/ExecAssist-Mac-*/ExecAssist-Mac-* 2>/dev/null | head -1); if [ -n "$f" ]; then xattr -c "$f"; chmod +x "$f"; "$f"; else echo "Could not find ExecAssist in Downloads - unzip it there first."; fi

          4. Your browser opens a moment later, already signed in. You are
             looking at a demo glazier's day.

          Leave Terminal open - that is the app running. Press Ctrl+C to stop.
          To start it again later, paste the same line again.

          Your account name and key are printed in Terminal. Keep them: they
          are how you sign in from your phone or another computer, and the key
          cannot be shown again.
          EOF
            ;;
          *)
            cat > "READ ME FIRST.txt" <<EOF
          Exec Assist - for ${{ matrix.note }}

          chmod +x ${{ matrix.label }} && ./${{ matrix.label }}

          Your browser opens a moment later, already signed in. Ctrl+C stops it.
          Your account name and key are printed in the terminal; keep them, as
          the key cannot be shown again.
          EOF
            ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            ${{ matrix.label }}${{ matrix.ext }}
            READ ME FIRST.txt
          if-no-files-found: error

  release:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # No merge-multiple: every artifact carries its own "READ ME FIRST.txt",
      # so merging would have them overwrite each other and three of the four
      # platforms would ship someone else's instructions. Keeping the artifacts
      # in separate directories means only the binaries are attached, and the
      # release body below carries the instructions instead.
      - uses: actions/download-artifact@v4
        with:
          path: downloads

      - uses: softprops/action-gh-release@v2
        with:
          files: downloads/*/ExecAssist-*
          generate_release_notes: true
          body: |
            Download the one for your computer. Each download contains the app
            and a "READ ME FIRST.txt" with the exact steps for that platform.

            - **Windows** — double-click it. If Windows objects, *More info* → *Run anyway*.
            - **Mac** — one command, because macOS blocks downloaded apps until you clear them.

            Either way your browser opens by itself, already signed in.
